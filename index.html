:root {
  --nav: #ffffff; --nav-edge: #d2ccc6;
  --canvas: #faf9f7; --surface: #ffffff; --ink: #111111; --ink-2: #444444; --muted: #6f6962; --hairline: #e9e5e2; --hairline-2: #d2ccc6; --fill: #f3f0ed; --ph: #a39d96;
  --brand: #ffc852; --brand-ink: #111111; --ok: #1f7f39; --warn: #c2470f; --scrim: rgba(17,17,17,.24);
  --plate-bg: #ffffff; --plate-ink: #111111; --plate-band: #1f3f9a;
  --font: "Switzer", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #161513; --surface: #1f1d1b; --ink: #f2efeb; --ink-2: #cfc9c2; --muted: #a29b93; --hairline: #34302c; --hairline-2: #46413b; --fill: #2a2724; --ph: #7f7871;
  --brand: #ffc852; --brand-ink: #111111; --ok: #4cc46a; --warn: #f08a50; --scrim: rgba(0,0,0,.5);
  --plate-bg: #f2efeb; --plate-ink: #111111; --plate-band: #3a5bc0; --nav: #2e2b28; --nav-edge: #4a4540; color-scheme: dark; } }
:root[data-theme="dark"] {
  --canvas: #161513; --surface: #1f1d1b; --ink: #f2efeb; --ink-2: #cfc9c2; --muted: #a29b93; --hairline: #34302c; --hairline-2: #46413b; --fill: #2a2724; --ph: #7f7871;
  --brand: #ffc852; --brand-ink: #111111; --ok: #4cc46a; --warn: #f08a50; --scrim: rgba(0,0,0,.5);
  --plate-bg: #f2efeb; --plate-ink: #111111; --plate-band: #3a5bc0; --nav: #2e2b28; --nav-edge: #4a4540; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; }
body.locked { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
/* iOS zooms the page into any field under 16px and leaves it zoomed: every field is 16px */
input, select, textarea { font-size: 16px !important; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.app { max-width: 720px; margin: 0 auto; padding-block: 12px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }

// ---------------- helpers ----------------
const fmt = (n, d = 2) => { const neg = n < 0; n = Math.abs(n); const [i, f] = n.toFixed(d).split('.'); return (neg ? '−' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (d ? ',' + f : ''); };
const eur = n => fmt(n) + '\u00a0€';
const pct = n => fmt(n * 100, 2) + '%';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const r2 = n => Math.round(n * 100) / 100;
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
let lang = 'ru';

const L = () => S[lang];
const km = n => fmt(n, 0) + '\u00a0' + L().km;
const ymParts = ym => ym.split('-').map(Number);
const monthName = ym => { const [y, m] = ymParts(ym); return cap1(MONTHS[lang][m - 1]) + ' ' + y; };
// "1 октября" / "1 de outubro" / "1 October"
const dayOfMonth = (ym, day) => { const [, m] = ymParts(ym); return `${day}\u00a0${MONTHS_OF[lang]?.[m - 1] || MON[lang][m - 1]}`; };
const lastDayOf = ym => { const [y, m] = ymParts(ym); return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
const monthIn = ym => { const [, m] = ymParts(ym); return (MONTHS_IN[lang] || MONTHS[lang])[m - 1]; };
const monthOf = ym => { const [, m] = ymParts(ym); return MONTHS[lang][m - 1]; };
const fullDate = iso => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${MON[lang][m - 1]} ${y}`; };
const dayLabel = iso => { const [, m, d] = iso.split('-').map(Number); return `${d} ${MON[lang][m - 1]}`; };
const addMonths = (ym, n) => { let [y, m] = ymParts(ym); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${String(m).padStart(2, '0')}`; };
const monthsBetween = (a, b) => { const [ya, ma] = ymParts(a), [yb, mb] = ymParts(b); return (yb - ya) * 12 + (mb - ma); };
const dueOf = ym => { const [y, m] = ymParts(addMonths(ym, 2)); return `20.${String(m).padStart(2, '0')}.${y}`; };
const pad2 = n => String(n).padStart(2, '0');
const NOW = new Date();
const TODAY = `${NOW.getFullYear()}-${pad2(NOW.getMonth() + 1)}-${pad2(NOW.getDate())}`;
const CURRENT = TODAY.slice(0, 7);
const TOUCH = matchMedia('(pointer: coarse)').matches;

// Amounts and km as people type them: "45.000" and "12.027,15" (PT), "12,027.15" (EN), "0,40", "0.40"
const num = v => {
  let s = String(v ?? '').replace(/[\s\u00a0€]/g, '');
  if (!/^-?[\d.,]*\d[\d.,]*$/.test(s)) return null;
  const c = s.lastIndexOf(','), d = s.lastIndexOf('.');
  const grouped = (x, sep) => new RegExp(`^-?\\d{1,3}(\\${sep}\\d{3})+$`).test(x);
  if (c >= 0 && d >= 0) {
    const dec = c > d ? ',' : '.', th = dec === ',' ? '.' : ',';
    const [ip, fp] = [s.slice(0, Math.max(c, d)), s.slice(Math.max(c, d) + 1)];
    if (fp.includes(th) || (ip.includes(th) && !grouped(ip, th))) return null;
    s = ip.split(th).join('') + '.' + fp;
  } else if (c >= 0) {
    if ((s.match(/,/g) || []).length > 1) { if (!grouped(s, ',')) return null; s = s.replace(/,/g, ''); } else s = s.replace(',', '.');

    const many = (s.match(/\./g) || []).length > 1;

const int = v => { const n = num(v); return n == null || n < 0 ? null : Math.round(n); };

function nifCheck(raw) {

// ---------------- section: VAT ----------------
function viewVat() {
  const T = L();
  const e = curEnt();

  const ps = periodsFor(e);

  const i = ps.findIndex(p => p.id === ui.period); const p = ps[i];

  // what was put into the return; true is an entry saved before the figure was kept
  const incVat = typeof D.included[key] === 'object' ? D.included[key].vat : r.vat; const stale = inc && incVat !== r.vat;

  }
  const status = r.bad.length ? `<span class="chip miss">${T.kmOff}</span>` : stale ? `<span class="chip miss">${T.changed}</span>` : inc ? `<span class="chip ok">${ico('check')}${T.included}</span>` : r.complete ? '' : r.running ? `<span class="chip run">${e.regime === 'M' ? T.runningM : T.running}</span>` : `<span class="chip miss">${T.missing}</span>`;
  // until the period ends the figures cover only the months already closed: say which
  const closedMs = p.months.filter(m => r.blocks.some(b => monthStats(b.car, m).ok && monthCost(b.car, m) !== null));
  const sofar = r.running && p.months.length > 1 && closedMs.length ? `<p class="note" style="padding-top:0">${T.sofar(closedMs.map(m => { const n = MONTHS[lang][ymParts(m)[1] - 1]; return lang === 'en' ? n : n.toLowerCase(); }).join(', '))}</p>` : '';
  // The card reads as the calculation itself: personal km share x the car's cost for the period = personal use; IVA on top
  const perCar = r.blocks.map((b, i) => {
    const miss = r.missing.filter(x => x.car.id === b.car.id && !x.future);
    const fixBtn = (m, label) => `<button class="btn text" style="min-height:28px;padding:0 4px" data-fix="${b.car.id}|${m}">${label}</button>`;
    const fix = miss.map(x => `<span class="sub fixline"><span>${cap1(T.noOdoFor(monthOf(x.m)))}</span>${fixBtn(x.m, T.fill)}</span>`).join('')
      + r.bad.filter(x => x.car.id === b.car.id).map(x => `<span class="err fixline"><span>${cap1(T.kmOffIn(monthOf(x.m)))}</span>${fixBtn(x.m, T.check)}</span>`).join('');
    return (i ? `<div class="carhead">${plate(b.car.plate)}</div>` : `<div class="cap">${plate(b.car.plate)}</div>${sofar}`)
      + prow(T.persKm, b.total && !r.bad.some(x => x.car.id === b.car.id) ? km(b.personal) : '—', { sub: fix || (b.total ? T.persKmCalc(fmt(b.total, 0), fmt(b.total - b.personal, 0)) : ''), left: !!fix })
      + prow(T['cost' + (b.car.acq || 'P')], eur(b.closed ? b.cost : b.costAll))
      + (r.bad.some(x => x.car.id === b.car.id) ? prow(T.persUse, '—') : prow(T.persUse, b.closed ? eur(b.base) : '—', { sub: b.total ? `${pct(b.share)} × ${eur(b.cost)}` : '' }));
  }).join('');

    ${stale ? prow(T.incWas, eur(incVat)) : ''}
    <div style="padding:8px 0 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">${status}${stale ? `<button class="btn" data-act="include">${T.update}</button>` : ''}${inc ? `<button class="btn ghost" data-act="unlink">${T.undo}</button>` : r.running ? `<p class="note" style="padding:0">${T.incFrom(fullDate(addMonths(p.months[p.months.length - 1], 1) + '-01'))}</p>` : r.complete ? `<button class="btn" data-act="include">${T.include}</button>` : ''}</div></div>`;
  return head + ctx + card;
}

// ---------------- section: mileage logs ----------------

// ---------------- picker (search by NIF / NIPC / name) ----------------
function pickerItems(kind, q) {
  if (kind.startsWith('c:')) { const c = CHOICES[kind.slice(2)]; return { items: c.opts.map(([v, t]) => ({ id: v, t, s: '', on: String(v) === c.value })) }; }
  const T = L(); const qq = q.trim().toLowerCase(); const digits = q.replace(/\D/g, '');
  const match = x => !qq || (x.name ?? `${x.t} ${x.s}`).toLowerCase().includes(qq) || (digits && x.nif?.includes(digits));
  let base;
  if (kind === 'lang') return { items: ['pt', 'en', 'ru'].map(l => ({ id: l, t: LANG_NAMES[l], s: '', on: l === lang })) };
  if (kind === 'month') { const car = carById(ui.carId); return { items: carMonths(car).slice().reverse().map(m => ({ id: m, t: monthName(m), s: monthState(car, m), on: m === ui.month })) }; }
  if (kind === 'period') { const e = ent(ui.entityId); return { items: periodsFor(e).slice().reverse().map(p => { const r = vatFor(e, p); return { id: p.id, t: p.label, s: `${T.due(p.due)} · ${r.bad.length ? T.kmOff : D.included[e.id + '|' + p.id] ? T.included : r.complete ? T.ready : r.running ? (e.regime === 'M' ? T.runningM : T.running) : r.blocks.length ? T.missing : T.noVatCars}`, on: p.id === ui.period }; }) }; }

  if (kind === 'car') { const ents = activeEnts(); return { items: ents.flatMap(e => entCars(e).map(c => ({ c, e }))).filter(({ c, e }) => !qq || `${c.plate} ${e.name} ${e.nif} ${ownerName(c) || ''}`.toLowerCase().includes(qq)).map(({ c, e }) => ({ id: c.id, t: c.plate, s: [c.own === 'PRIV' ? ownerName(c) : '', ents.length > 1 ? `${taxId(e.nif)} · ${e.name}` : ''].filter(Boolean).join(' · '), on: c.id === ui.carId })) }; }
  if (kind === 'entity') base = activeEnts().map(e => ({ id: e.id, t: taxId(e.nif), s: e.name, nif: e.nif, name: e.name, on: e.id === ui.entityId }));
  if (kind === 'payer') base = D.entities.filter(e => D.cars.some(c => c.own === 'PRIV' && c.payerId === e.id)).map(e => ({ id: e.id, t: e.name, s: `NIPC ${nifShow(e.nif)}`, nif: e.nif, name: e.name, on: e.id === ui.payerId }));

  }
  if (kind === 'g-purpose') {
    const use = new Map(); for (const t of entTrips()) { const k = t.pk ? 'k:' + t.pk : 'c:' + t.purpose; if (t.pk || t.purpose) use.set(k, (use.get(k) || 0) + 1); }
    const custom = [...new Set(entTrips().filter(t => !t.pk && t.purpose).map(t => t.purpose))];
    base = [...Object.entries(T.purposes).map(([k, v]) => ({ id: 'k:' + k, t: v, s: '', pk: k })), ...custom.map(v => ({ id: 'c:' + v, t: v, s: '' }))]
      .map((x, i) => ({ ...x, i, on: d?.purpose === x.t })).sort((a, b) => (use.get(b.id) || 0) - (use.get(a.id) || 0) || a.i - b.i);
  }
  if (kind === 'f-owner') base = D.entities.map(e => ({ id: e.id, t: taxId(e.nif), s: e.name, nif: e.nif, name: e.name, on: d?.owner?.id === e.id }));
  if (kind === 'f-person') base = D.people.map(p => ({ id: p.id, t: taxId(p.nif), s: p.name, nif: p.nif, name: p.name, on: d?.person?.id === p.id }));
  if (kind === 'f-payer') base = D.entities.filter(e => e.nif !== d?.person?.nif).map(e => ({ id: e.id, t: taxId(e.nif), s: e.name, nif: e.nif, name: e.name, on: d?.payer?.id === e.id }));
  // Below 10 options the list is not filtered (no search); the input then only takes a new number
  const filter = ui.pop?.filter !== false;
  const items = filter ? base.filter(match) : base.slice();

  if (kind.startsWith('g-')) {
    const raw = q.trim(); const text = kind === 'g-purpose' ? raw : addrNorm(raw);
    const same = x => x.t.toLowerCase() === text.toLowerCase() || x.id.toLowerCase() === text.toLowerCase();

    else if (!items.length) msg = T.nothing;

  }

    if (!ch.ok) { msg = T[ch.err]; warn = ch.err !== 'type9'; }
    else if (want === 'PERSON' && ch.kind !== 'PERSON') { msg = T.needPerson; warn = true; }
    else { const reg = REGISTRY[ch.v]; const known = D.entities.find(e => e.nif === ch.v)?.name || D.people.find(x => x.nif === ch.v)?.name; items.unshift({ id: 'new:' + ch.v, t: known ? taxId(ch.v) : T.newNif(taxId(ch.v)), s: reg ? `${reg} · ${T.fromRegistry}` : known || T.newOne, nif: ch.v, name: reg || known || '', isNew: true, known: !!known, kind: ch.kind }); }
  } else if (!items.length) msg = T.nothing;
  if (kind.startsWith('f-') && filter && !digits.length && !items.length) msg = T.typeToAdd;
  return { items, msg, warn };
}
